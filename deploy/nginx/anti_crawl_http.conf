# Place this file in /etc/nginx/conf.d/00-jwalpha-anti-crawl.conf.
# It is loaded in nginx's http context by the default nginx.conf.

limit_req_zone $binary_remote_addr zone=jw_api:20m rate=240r/m;
limit_req_zone $binary_remote_addr zone=jw_login:10m rate=20r/m;
limit_req_status 429;

map $http_user_agent $jw_bad_bot {
    default 0;
    ~*(sqlmap|nikto|acunetix|nessus|masscan|nmap|zgrab|dirbuster|gobuster|wpscan) 1;
}
