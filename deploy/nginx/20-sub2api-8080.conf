limit_req_zone $binary_remote_addr zone=sub2api_web:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sub2api_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sub2api_auth:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=sub2api_conn:10m;

map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    ''      '';
}

log_format sub2api_8080 '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time';

server {
    listen 0.0.0.0:8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/sub2api-8080.access.log sub2api_8080;
    error_log /var/log/nginx/sub2api-8080.error.log warn;

    client_max_body_size 64m;
    client_body_timeout 30s;
    send_timeout 900s;
    limit_conn sub2api_conn 50;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sub2api_connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location ~* "(?:\.env|\.git|\.svn|\.hg|\.aws|\.ssh|id_rsa|wp-config|actuator|phpmyadmin|server-status|(?:^|/)etc/passwd|users\.db|paper_trading\.db|\.(?:sql|sqlite|db|bak|old|zip|tar|gz)(?:[/.;]|$))" {
        return 404;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=sub2api_auth burst=6 nodelay;
        proxy_pass http://127.0.0.1:18080;
    }

    location ~ ^/(api|v1)/ {
        limit_req zone=sub2api_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:18080;
    }

    location / {
        limit_req zone=sub2api_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:18080;
    }
}
