# Include inside the jwalpha.top server block before the proxy location:
# include /etc/nginx/snippets/jwalpha-anti-crawl-server.conf;

if ($jw_bad_bot) {
    return 403;
}

location ~* (^|/)(\.git|\.svn|\.hg|\.env|\.aws|\.ssh|id_rsa|users\.db|paper_trading\.db|config\.py|secret|secrets|backup|backups|dump|logs?|data)(/|$) {
    return 404;
}

location ~* \.(sql|sqlite|db|bak|old|zip|tar|gz)$ {
    return 404;
}

location = /api/auth/login {
    limit_req zone=jw_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
}

location /api/ {
    limit_req zone=jw_api burst=80 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
}
