name: tests

# 每次推送 main / 提 PR：全量单元测试 + 路由基线对比 + ruff lint。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Run full test suite
        env:
          QUANT_TEST_IMPORT: "1"
        run: python -m pytest tests -q

      - name: Verify route baseline (接口零变化守卫)
        env:
          QUANT_TEST_IMPORT: "1"
        run: |
          python _verify_routes.py | tee /tmp/routes.txt
          grep -q "RESULT: IDENTICAL" /tmp/routes.txt
